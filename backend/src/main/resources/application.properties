spring.config.import=optional:file:./.env[.properties]
spring.application.name=esibuy
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/esibuy}
spring.data.mongodb.auto-index-creation=true

server.error.include-message=always
server.error.include-stacktrace=always

server.error.include-binding-errors=never
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
app.security.aes-key=1234567890123456

# OTP por email: implementación provisional de desarrollo.
# TODO: integrar el envío real mediante Brevo.
app.security.email-otp.validity-seconds=600

esibuy.password-reset.log-token=true