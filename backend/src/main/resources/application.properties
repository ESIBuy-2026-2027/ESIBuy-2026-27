spring.config.import=optional:file:./.env[.properties]
spring.application.name=esibuy
server.port=${PORT:8080}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/esibuy}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/esibuy}
spring.data.mongodb.database=${MONGODB_DATABASE:esibuy}
spring.mongodb.database=${MONGODB_DATABASE:esibuy}
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.error.include-message=always
server.error.include-stacktrace=always

server.error.include-binding-errors=never
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
app.security.aes-key=${AES_KEY:1234567890123456}
jwt.secret=${JWT_SECRET:1234567890123456}

# OTP por email: implementación provisional de desarrollo.

# Envío de correos para recuperación de contraseñas
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USER:no-reply@esibuy.com}
spring.mail.password=${EMAIL_PWD:}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=10000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000

# URL del frontend utilizada en el enlace de recuperación
esibuy.password-reset.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.security.email-otp.validity-seconds=600
app.security.email-otp.log-code=${EMAIL_OTP_LOG_CODE:true}

esibuy.password-reset.log-token=true
spring.data.mongodb.auto-index-creation=false