# ==============================================================================
# Pipeline de CI/CD - ESIBuy 2026
# Historias de Usuario: 301 (Integración Continua) y 302 (Despliegue Continuo)
# Tareas: 487 (Triggers), 488 (Compilación Backend), 490 (Tests + JaCoCo + SonarQube),
#         503 (Frontend CI), 495 (Empaquetado JAR), 496 (Build Producción Angular),
#         498 (Variables Seguras y Artefacto JAR), 504 (Despliegue Firebase Hosting)
# ==============================================================================

name: $(date:yyyyMMdd)$(rev:.r)

# ------------------------------------------------------------------------------
# Tarea 487: Triggers automáticos en push y Pull Request hacia develop y main
# ------------------------------------------------------------------------------
trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_OPTS: '-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'
  SONAR_HOST_URL: 'http://seralu4.esi.uclm.es:1521/'

stages:
  # ============================================================================
  # STAGE 1: INTEGRACIÓN CONTINUA (CI)
  # ============================================================================
  - stage: CI
    displayName: 'Stage 1: Integración Continua'
    jobs:
      # ------------------------------------------------------------------------
      # Tareas 488 y 490: Backend CI (Compilación, Tests, JaCoCo y SonarQube)
      # ------------------------------------------------------------------------
      - job: Backend_CI
        displayName: 'Backend CI (Java 21 / Maven / JaCoCo / SonarQube)'
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Configurar JDK 21'
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Maven@4
            displayName: 'Compilar backend y ejecutar tests con JaCoCo'
            inputs:
              mavenPomFile: 'backend/pom.xml'
              goals: 'clean verify'
              options: '-B'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
              mavenVersionOption: 'Default'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar reporte de cobertura JaCoCo en Azure DevOps'
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/backend/target/site/jacoco/jacoco.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/backend/src/main/java/'
            condition: succeededOrFailed()

          - script: |
              cd backend
              SONAR_AUTH_TOKEN="${SONAR_TOKEN:-squ_11efbdd2b29294aaa690ecc31fd36bc8eb3dea53}"
              mvn sonar:sonar \
                -B \
                -Dsonar.host.url="$(SONAR_HOST_URL)" \
                -Dsonar.login="$SONAR_AUTH_TOKEN" \
                -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml"
            displayName: 'Ejecutar análisis de SonarQube Backend'
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
            condition: succeeded()

      # ------------------------------------------------------------------------
      # Tarea 503: Frontend CI (Angular, Tests Vitest y SonarQube)
      # ------------------------------------------------------------------------
      - job: Frontend_CI
        displayName: 'Frontend CI (Node 22 / Angular / Vitest / SonarQube)'
        steps:
          - task: NodeTool@0
            displayName: 'Configurar Node.js 22.x'
            inputs:
              versionSpec: '22.x'

          - script: |
              cd frontend
              npm ci
            displayName: 'Instalar dependencias Frontend (npm ci)'

          - script: |
              cd frontend
              npm test -- --watch=false
            displayName: 'Ejecutar tests unitarios de Angular'

          - script: |
              cd frontend
              npm run build
            displayName: 'Compilación de verificación Frontend'

          - script: |
              cd frontend
              SONAR_AUTH_TOKEN="${SONAR_TOKEN:-squ_11efbdd2b29294aaa690ecc31fd36bc8eb3dea53}"
              npx --yes sonar-scanner \
                -Dsonar.host.url="$(SONAR_HOST_URL)" \
                -Dsonar.login="$SONAR_AUTH_TOKEN"
            displayName: 'Ejecutar análisis de SonarQube Frontend'
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
            condition: succeeded()

  # ============================================================================
  # STAGE 2: DESPLIEGUE CONTINUO / RELEASE (CD)
  # Solo se ejecuta si CI es exitoso y NO es una Pull Request
  # ============================================================================
  - stage: CD
    displayName: 'Stage 2: Despliegue Continuo / Release'
    dependsOn: CI
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Release
        displayName: 'Empaquetado, Publicación y Despliegue en Firebase'
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Configurar JDK 21'
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: NodeTool@0
            displayName: 'Configurar Node.js 22.x'
            inputs:
              versionSpec: '22.x'

          # --------------------------------------------------------------------
          # Tarea 498: Validación estricta de variables de entorno y secrets
          # --------------------------------------------------------------------
          - script: |
              echo "=================================================================="
              echo "Validando presencia de secretos y variables de entorno críticas..."
              echo "=================================================================="
              MISSING_SECRETS=0

              if [ -z "$MONGODB_URI" ]; then
                echo "##vso[task.logissue type=error]Falta la variable secreta MONGODB_URI en Azure Pipelines."
                MISSING_SECRETS=1
              else
                echo "[OK] Secreto MONGODB_URI detectado."
              fi

              if [ -z "$JWT_SECRET" ] && [ -z "$AES_KEY" ]; then
                echo "##vso[task.logissue type=error]Falta la variable secreta JWT_SECRET o AES_KEY en Azure Pipelines."
                MISSING_SECRETS=1
              else
                echo "[OK] Clave de seguridad (JWT_SECRET / AES_KEY) detectada."
              fi

              if [ -z "$FIREBASE_TOKEN" ]; then
                echo "##vso[task.logissue type=error]Falta la variable secreta FIREBASE_TOKEN en Azure Pipelines."
                MISSING_SECRETS=1
              else
                echo "[OK] Secreto FIREBASE_TOKEN detectado."
              fi

              if [ $MISSING_SECRETS -ne 0 ]; then
                echo "##vso[task.complete result=Failed;]Validación de variables de entorno fallida. Define los secretos en las variables de Azure Pipelines."
                exit 1
              fi
            displayName: 'Validar secretos de entorno (MongoDB, JWT/AES, Firebase)'
            env:
              MONGODB_URI: $(MONGODB_URI)
              JWT_SECRET: $(JWT_SECRET)
              AES_KEY: $(AES_KEY)
              FIREBASE_TOKEN: $(FIREBASE_TOKEN)

          # --------------------------------------------------------------------
          # Tarea 495: Empaquetado final ejecutable de Spring Boot (.JAR)
          # --------------------------------------------------------------------
          - script: |
              cd backend
              mvn clean package -DskipTests -B
            displayName: 'Generar .JAR ejecutable de Spring Boot'

          # --------------------------------------------------------------------
          # Tarea 498: Publicar artefacto .JAR en Azure Pipelines
          # --------------------------------------------------------------------
          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefacto JAR ejecutable'
            inputs:
              PathtoPublish: 'backend/target'
              ArtifactName: 'esibuy-backend-drop'
              publishLocation: 'Container'

          # --------------------------------------------------------------------
          # Tarea 496: Build de producción en Angular
          # --------------------------------------------------------------------
          - script: |
              cd frontend
              npm ci
              npm run build -- --configuration production
            displayName: 'Compilación de producción Angular (ng build --configuration production)'

          # --------------------------------------------------------------------
          # Tarea 504: Despliegue continuo en Firebase Hosting
          # --------------------------------------------------------------------
          - script: |
              cd frontend
              echo "Desplegando SPA Angular en Firebase Hosting..."
              npx --yes firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
            displayName: 'Desplegar Frontend en Firebase Hosting'
            env:
              FIREBASE_TOKEN: $(FIREBASE_TOKEN)
