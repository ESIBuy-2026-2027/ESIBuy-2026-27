<header class="app-header">
  <a class="app-brand" routerLink="/">
    <span class="brand-text">ESI<span class="brand-accent">Buy</span></span>
  </a>
  @if (authService.currentUser(); as user) {
  <div class="app-session">
    @if (user.role === 'CLIENT') {
    <a class="header-cart" routerLink="/client/cart" [attr.aria-label]="'Carrito, ' + cartService.itemCount() + ' artículos'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
      <span>Carrito</span>
      <span class="header-cart-count">{{ cartService.itemCount() }}</span>
    </a>
    }
    <div class="go-profile">
      <button type="button" class="profile-button" (click)="toggleProfileMenu(); $event.stopPropagation()"
        title="Perfil" aria-haspopup="menu" [attr.aria-expanded]="profileMenuOpen()" aria-controls="profile-menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
        </svg>
        <svg class="profile-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m4 6 4 4 4-4" />
        </svg>
        <span class="visually-hidden">Perfil</span>
      </button>
      @if (profileMenuOpen()) {
      <div id="profile-menu" class="profile-menu" aria-label="Opciones de cuenta" (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()">
        <p class="profile-menu-email">{{ user.email }}</p>
        <button type="button" class="profile-menu-item" (click)="goToProfile()">
          Mi perfil
        </button>
        <button type="button" class="profile-menu-item" (click)="logout()">
          Cerrar sesión
        </button>
      </div>
      }
    </div>
  </div>
  }
</header>

@if (logoutError(); as error) {
<p class="logout-error" role="alert">{{ error }}</p>
}

<router-outlet />
