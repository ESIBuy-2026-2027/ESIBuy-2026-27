<div class="seller-layout seller-shell" [class.app-sidebar-collapsed]="sidebarCollapsed()">
  <aside class="sidebar app-sidebar" aria-label="Panel del cliente">
    <button type="button" class="app-sidebar-toggle" (click)="toggleSidebar()"
      aria-label="Ocultar barra lateral"><span aria-hidden="true">‹</span></button>
    <a class="brand" routerLink="/client/catalog" aria-label="ESIBuy">
      <span class="brand-mark" aria-hidden="true">E</span>
      <span>ESI<span class="brand-accent">Buy</span></span>
    </a>

    <div class="sidebar-caption">ÁREA DE CLIENTE</div>
    <nav class="seller-navigation" aria-label="Navegación del cliente">
      <a class="navigation-link" routerLink="/client/catalog">
        <svg class="navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
          <path d="M3 6h18" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
        <span>Catálogo</span>
      </a>

      <a class="navigation-link" routerLink="/client/wishlist">
        <svg class="navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path
            d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
        </svg>
        <span>Lista de deseos</span>
      </a>

      <a class="navigation-link is-active" routerLink="/client/orders" aria-current="page">
        <svg class="navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        <span>Mis compras</span>
      </a>

      <a class="navigation-link" routerLink="/client/cart">
        <svg class="navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        <span>Carrito</span>
      </a>

      <a class="navigation-link" routerLink="/client/profile">
        <svg class="navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span>Perfil</span>
      </a>
    </nav>
  </aside>

  <button type="button" class="app-sidebar-toggle-open" (click)="toggleSidebar()"
    aria-label="Mostrar barra lateral" [hidden]="!sidebarCollapsed()"><span aria-hidden="true">›</span></button>

  <div class="workspace app-workspace">
    <main class="catalog-content">
      <section class="page-heading" aria-labelledby="orders-title">
        <div>
          <h1 id="orders-title">Mis compras</h1>
          <p class="page-description">Historial y seguimiento de tus pedidos en ESIBuy.</p>
        </div>
      </section>

      <div class="empty-state">
        <span class="empty-icon" aria-hidden="true">🛍</span>
        <h3>Aún no has realizado compras</h3>
        <p>Cuando realices un pedido, podrás seguir su estado desde aquí.</p>
        <a routerLink="/client/catalog" class="secondary-action">Explorar catálogo</a>
      </div>
    </main>
  </div>
</div>
