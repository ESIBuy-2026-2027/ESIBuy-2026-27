<div class="login-container">

  <main class="login-card">

    <header class="login-header">
      <div class="brand">
        <span class="brand-name">ESIBuy</span>
        <span class="brand-badge">Plataforma de Comercio Electrónico</span>
      </div>

      <h1>Iniciar sesión</h1>

      <p class="login-subtitle">
        Accede a tu cuenta para continuar.
      </p>
    </header>

    <div *ngIf="serverError" class="server-error-banner">
      {{ serverError }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <section class="form-section">

        <div class="form-group">
          <label for="email">Email</label>

          <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com"
            autocomplete="email" />

          <span class="error" *ngIf="
              loginForm.get('email')?.touched &&
              loginForm.get('email')?.hasError('required')
            ">
            El email es obligatorio
          </span>

          <span class="error" *ngIf="
              loginForm.get('email')?.touched &&
              loginForm.get('email')?.hasError('email')
            ">
            Formato de email no válido
          </span>

        </div>

        <div class="form-group">

          <label for="password">Contraseña</label>

          <div class="password-wrapper">

            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
              placeholder="Tu contraseña" autocomplete="current-password" />

            <button type="button" class="password-toggle" (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

                <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2" />
              </svg>

              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

                <path
                  d="M10.6 6.2A10.5 10.5 0 0 1 12 6c6 0 9.5 6 9.5 6a17.5 17.5 0 0 1-3.2 3.8M6.2 6.2C3.9 7.8 2.5 12 2.5 12s3.5 6 9.5 6c1.4 0 2.7-.3 3.8-.8"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>

          </div>

          <span class="error" *ngIf="
              loginForm.get('password')?.touched &&
              loginForm.get('password')?.hasError('required')
            ">
            La contraseña es obligatoria
          </span>

        </div>

      </section>

      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ loading ? 'Iniciando sesión...' : 'Entrar' }}
      </button>

    </form>

    <div class="forgot-password">
      <button type="button" class="forgot-password-link" (click)="showForgotPasswordMessage()">
        ¿Has olvidado tu contraseña?
      </button>
      <p *ngIf="forgotPasswordMessage" class="forgot-password-message" role="status">
        {{ forgotPasswordMessage }}
      </p>
    </div>

    <div class="auth-links">
      <span>¿No tienes cuenta?</span>
      <a routerLink="/register" class="auth-link">
        Regístrate aquí
      </a>
    </div>

  </main>

</div>
